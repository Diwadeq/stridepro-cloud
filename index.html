<script>
const KEY="stridepro-cloud-v1";let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const monday=s=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const addD=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());let mon=monday(TODAY);
const fmt=s=>{const d=new Date(s+"T12:00:00");return d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0")};
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(){
  const first=DAYS[0].d,last=DAYS[DAYS.length-1].d;
  if(mon<monday(first))mon=monday(first);if(mon>monday(last))mon=monday(last);
  document.getElementById("wk").textContent=fmt(mon)+" – "+fmt(addD(mon,6))+(mon===monday(TODAY)?" · ten tydzień":"");
  const rows=DAYS.filter(x=>x.d>=mon&&x.d<=addD(mon,6));
  document.getElementById("m").innerHTML=rows.length?rows.map(x=>{const s=S[x.d]||{};
   return `<div class="day ${x.d===TODAY?"today":x.d<TODAY?"past":""}" id="d${x.d}"><div class="hd"><span>${x.dn} ${fmt(x.d)}</span><span>${x.b?x.b+" kcal spalone":""}</span></div>
   <div class="t"><span class="tag">${esc(x.c)}</span>${esc(x.t)}</div>${x.g?`<div class="x">💪 ${esc(x.g)}</div>`:""}<div class="x">${esc(x.x)}</div>
   <label><input type="checkbox" data-d="${x.d}" data-k="ok" ${s.ok?"checked":""}> Zrobione</label>
   <label>Zjedzone kcal <input type="number" data-d="${x.d}" data-k="kcal" value="${s.kcal??""}"></label>
   <label>Waga rano (kg) <input type="number" step="0.1" data-d="${x.d}" data-k="kg" value="${s.kg??""}"></label>
   ${x.d<=TODAY?`<label>Garmin spalone ${x.d===TODAY?"wczoraj":"tego dnia"} <input type="number" data-d="${x.d===TODAY?addD(x.d,-1):x.d}" data-k="garmin" value="${(S[x.d===TODAY?addD(x.d,-1):x.d]||{}).garmin??""}"></label>`:""}
   </div>`}).join(""):"<p>Brak planu na ten tydzień.</p>";
}
document.getElementById("m").addEventListener("change",e=>{const t=e.target,d=t.dataset.d;if(!d)return;const k=t.dataset.k;(S[d]=S[d]||{})[k]=t.type==="checkbox"?t.checked:(t.value===""?null:Number(t.value));(S[d].u=S[d].u||{})[k]=Date.now();save();push()});
document.getElementById("prev").onclick=()=>{mon=addD(mon,-7);render()};
document.getElementById("next").onclick=()=>{mon=addD(mon,7);render()};
document.getElementById("today").onclick=()=>{mon=monday(TODAY);render();const e=document.getElementById("d"+TODAY);e&&e.scrollIntoView()};
let x0=null;document.addEventListener("touchstart",e=>x0=e.touches[0].clientX);
document.addEventListener("touchend",e=>{if(x0===null||e.target.closest("input"))return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>80){mon=addD(mon,dx<0?7:-7);render()}});
// ---- GitHub sync: kcal.json in the repo, per-field newest wins ----
const REPO="Diwadeq/stridepro-data",FILE="kcal.json";let TOKEN="";try{TOKEN=localStorage.getItem("sp-token")||""}catch(e){}
const api=()=>"https://api.github.com/repos/"+REPO+"/contents/"+FILE;
const hdr=()=>({Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json"});
function merge(a,b){const o={...a};for(const d in b){const x=o[d]=o[d]||{u:{}},y=b[d];x.u=x.u||{};for(const k of Object.keys(y.u||{}))if((y.u[k]||0)>(x.u[k]||0)){x[k]=y[k];x.u[k]=y.u[k]}}return o}
let sha=null,busy=false,again=false;
async function pull(){if(!TOKEN)return;const r=await fetch(api(),{headers:hdr(),cache:"no-store"});
 if(r.status===404){sha=null;return}if(!r.ok)throw new Error(r.status);const j=await r.json();sha=j.sha;
 const rem=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));S=merge(S,rem);save()}
async function push(){if(!TOKEN)return;if(busy){again=true;return}busy=true;setSt("…");
 try{await pull();const body={message:"sync",content:btoa(unescape(encodeURIComponent(JSON.stringify(S)))),...(sha?{sha}:{})};
  const r=await fetch(api(),{method:"PUT",headers:hdr(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422){busy=false;return push()}if(!r.ok)throw new Error(r.status);sha=(await r.json()).content.sha;setSt("✓")}
 catch(e){setSt("✗ "+e.message)}busy=false;if(again){again=false;push()}}
function setSt(t){document.getElementById("st").textContent=t}
document.getElementById("st").onclick=()=>{const t=prompt("Token GitHub (tylko to repo, Contents read/write):",TOKEN);if(t!==null){TOKEN=t.trim();try{localStorage.setItem("sp-token",TOKEN)}catch(e){}pull().then(()=>{render();push()}).catch(e=>setSt("✗ "+e.message))}};
if(TOKEN)pull().then(()=>{render();setSt("✓")}).catch(e=>setSt("✗ "+e.message));else setSt("🔑");
setInterval(()=>{if(TOKEN&&!document.hidden&&!busy&&!document.activeElement.matches("input"))pull().then(render).catch(()=>{})},60000);
render();
</script></body></html>
